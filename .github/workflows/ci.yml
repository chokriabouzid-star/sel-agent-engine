name: ci

on:
  push:
    branches: [main, master, phase2-safe]
  pull_request:
    branches: [main, master, phase2-safe]

jobs:
  build-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust (pinned by rust-toolchain.toml)
        run: |
          rustup --version
          rustup toolchain install
          rustup show active-toolchain
          rustc --version
          cargo clippy --version

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.22'

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '18'

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo check
        run: cargo check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test

      - name: cargo build --release
        run: cargo build --release

      - name: provision python replay environments
        run: ./target/release/sel-agent provision-python-environments

      - name: bench replay
        run: ./target/release/sel-agent bench --suite all --replay

      - name: bench-swe replay
        run: ./target/release/sel-agent bench-swe --lang all --replay
