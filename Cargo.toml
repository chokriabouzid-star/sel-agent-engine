[package]
name    = "sel-agent"
version = "6.9.1"
edition = "2021"

[[bin]]
name = "sel-agent"
path = "src/main.rs"

[dependencies]
regex = "1"
anyhow     = "1"
tokio      = { version = "1", features = ["full"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest    = { version = "0.12", features = ["json"] }
clap       = { version = "4",  features = ["derive"] }
indicatif  = "0.17"
colored    = "2"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3"
