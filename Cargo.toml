[package]
name = "sel-agent-engine"
version = "9.2.5"
edition = "2021"
authors = ["Chokri Bouzid"]
description = "SEL Agent Engine — Autonomous Software Engineering Agent with directed repair, compile-check, and LLM-powered code generation."
license = "MIT"
readme = "README.md"
repository = "https://github.com/chokribouzid/sel-agent"
keywords = ["agent", "llm", "code-generation", "repair", "testing"]
categories = ["development-tools", "command-line-utilities"]

[lib]
name = "sel_agent"
path = "src/lib.rs"

[[bin]]
name = "sel-agent"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset", "http2", "gzip"] }
regex = "1"
clap = { version = "4.0", features = ["derive"] }
colored = "3.1.1"
indicatif = "0.18.4"
dirs = "5.0"
async-trait = "0.1.77"
chrono = "0.4"
walkdir = "2"
crossterm = "0.28"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
[dev-dependencies]
tempfile = "3"
pretty_assertions = "1"
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
strip = true
